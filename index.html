<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a10">
  <meta name="description" content="NeuroBingo — bingo de momentos, caos e pequenas competições.">
  <title>NeuroBingo — carregando</title>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;min-height:100%;background:#090a10;color:#f4f2f3;font:14px Inter,system-ui,Segoe UI,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    #boot h1{letter-spacing:.14em;font-size:clamp(28px,6vw,48px);margin:0 0 12px}
    #boot p{color:#aaa;line-height:1.6;max-width:440px}
    .loader{width:42px;height:42px;border:3px solid #ffffff20;border-top-color:#ff4d8d;border-radius:50%;margin:24px auto 0;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="boot"><div><h1>NEUROBINGO</h1><p>Preparando o caos, carregando frases e afinando os neurônios…</p><div class="loader" aria-hidden="true"></div></div></main>
  <script>
    (async function(){
      const boot = document.getElementById('boot');
      const totalParts = 18;
      const parts = await Promise.all(Array.from({length:totalParts}, function(_,i){
        const file = 'part-' + String(i+1).padStart(2,'0') + '.txt';
        return fetch('assets/bundle/' + file).then(function(response){
          if(!response.ok) throw new Error('Não foi possível carregar ' + file + ' (' + response.status + ')');
          return response.text();
        });
      }));
      const binary = atob(parts.join('').trim());
      const bytes = Uint8Array.from(binary, function(char){ return char.charCodeAt(0); });
      if(typeof DecompressionStream === 'undefined') throw new Error('Este navegador não oferece suporte à descompressão necessária. Atualize o navegador.');
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const source = JSON.parse(await new Response(stream).text());
      const parsed = new DOMParser().parseFromString(source['index.html'], 'text/html');

      document.title = parsed.title || 'NeuroBingo';
      document.head.querySelectorAll('meta[name="theme-color"],meta[name="description"]').forEach(function(node){node.remove()});
      Array.from(parsed.head.children).forEach(function(node){
        if(node.tagName === 'LINK' || node.tagName === 'STYLE' || node.tagName === 'SCRIPT') return;
        document.head.appendChild(node.cloneNode(true));
      });
      const style = document.createElement('style');
      style.textContent = source['css/styles.css'];
      document.head.appendChild(style);

      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/svg+xml';
      favicon.href = URL.createObjectURL(new Blob([source['assets/neurobingo.svg']], {type:'image/svg+xml'}));
      document.head.appendChild(favicon);

      document.body.className = parsed.body.className;
      parsed.body.querySelectorAll('script').forEach(function(node){node.remove()});
      document.body.innerHTML = parsed.body.innerHTML;

      for(const path of ['js/audio.js','js/minigames.js','js/app.js']){
        const script = document.createElement('script');
        script.src = URL.createObjectURL(new Blob([source[path]], {type:'text/javascript'}));
        await new Promise(function(resolve,reject){
          script.onload = resolve;
          script.onerror = function(){reject(new Error('Falha ao iniciar ' + path))};
          document.body.appendChild(script);
        });
      }
    })().catch(function(error){
      console.error('NeuroBingo:', error);
      document.body.innerHTML = '<main id="boot"><div><h1>NEUROBINGO</h1><p>Não foi possível carregar o jogo.</p><p>' + String(error.message || error) + '</p><p>Confira se está abrindo pelo GitHub Pages ou por um servidor local, e não diretamente por file://.</p></div></main>';
    });
  </script>
</body>
</html>
